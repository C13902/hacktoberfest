[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localcommit"
version = "0.1.0"
description = "Write git commit messages with a local open-weight LLM. Zero dependencies, no cloud."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["git", "llm", "ollama", "open-weight", "hacktoberfest"]

[project.scripts]
localcommit = "localcommit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
